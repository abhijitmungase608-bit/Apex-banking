version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: apex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apex_admin
      POSTGRES_PASSWORD: ApexSecurePassword2026
      POSTGRES_DB: apex_banking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex_admin -d apex_banking"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Distributed Lock
  redis:
    image: redis:7-alpine
    container_name: apex_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. NestJS Institutional Core Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex_backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://apex_admin:ApexSecurePassword2026@postgres:5432/apex_banking?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: apex_production_vault_jwt_super_secret_key_99018274
      APEX_SANDBOX_MODE: "true"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. Vite React Frontend (Nginx Production Container)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
